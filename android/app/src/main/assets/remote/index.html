<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lumen">
<meta name="theme-color" content="#0A0C11">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon.png">
<title>Lumen</title>
<style>
  :root {
    --bg: #0A0C11; --surface: #161A23; --surface-hi: #222838; --text: #F4F6FA; --dim: rgba(244,246,250,.62);
    --faint: rgba(244,246,250,.38); --accent: #8AA4FF; --ok: #4CD787; --warn: #FF7A6B;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
  body {
    min-height: 100dvh; padding: max(env(safe-area-inset-top), 14px) 18px max(env(safe-area-inset-bottom), 18px);
    background: radial-gradient(120% 60% at 85% -10%, rgba(138,164,255,.28), transparent 60%), var(--bg);
    -webkit-user-select: none; user-select: none;
  }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .brand { font-weight: 700; font-size: 22px; letter-spacing: .2px; }
  .brand span { color: var(--accent); }
  .status { font-size: 12px; color: var(--dim); display: flex; align-items: center; gap: 6px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
  .dot.on { background: var(--ok); }
  h2 { font-size: 11px; letter-spacing: 1.8px; text-transform: uppercase; color: var(--faint); font-weight: 600; margin: 22px 2px 10px; }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; }
  button:active { transform: scale(.96); }

  /* Teclado direcional */
  .pad { position: relative; width: min(78vw, 300px); aspect-ratio: 1; margin: 6px auto 0; border-radius: 50%;
         background: radial-gradient(circle at 50% 35%, #262c3d, #171b25 70%); box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 18px 40px rgba(0,0,0,.45); }
  .pad button { position: absolute; background: transparent; color: var(--dim); font-size: 26px; display: grid; place-items: center; }
  .pad .up { top: 0; left: 30%; width: 40%; height: 30%; }
  .pad .down { bottom: 0; left: 30%; width: 40%; height: 30%; }
  .pad .left { left: 0; top: 30%; width: 30%; height: 40%; }
  .pad .right { right: 0; top: 30%; width: 30%; height: 40%; }
  .pad .ok { top: 31%; left: 31%; width: 38%; height: 38%; border-radius: 50%; background: var(--surface-hi);
             color: var(--text); font-size: 17px; font-weight: 600; box-shadow: 0 6px 18px rgba(0,0,0,.4); }
  .row { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 10px; margin-top: 14px; }
  .btn { background: var(--surface); border-radius: 16px; padding: 14px 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 13px; color: var(--dim); }
  .btn b { font-size: 20px; color: var(--text); font-weight: 500; }
  .btn.accent b { color: var(--accent); }
  .volume { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; }
  .volume .num { font-size: 13px; color: var(--dim); text-align: center; min-width: 70px; }
  .volume .num b { display: block; font-size: 22px; color: var(--text); font-weight: 600; }
  .bar { height: 4px; border-radius: 4px; background: rgba(255,255,255,.12); margin-top: 6px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .25s; }

  .search { display: flex; gap: 8px; }
  .search input { flex: 1; min-width: 0; background: var(--surface); border: 1px solid rgba(255,255,255,.06); color: var(--text);
                  border-radius: 14px; padding: 13px 14px; font: inherit; outline: none; }
  .search input:focus { border-color: var(--accent); }
  .search button { background: var(--accent); color: #0A0C11; border-radius: 14px; padding: 0 16px; font-weight: 600; }

  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .app { border-radius: 16px; padding: 16px 12px; text-align: left; font-weight: 600; font-size: 14px; color: #fff;
         background: linear-gradient(135deg, var(--c, #333), rgba(10,12,17,.85)); min-height: 64px; display: flex; align-items: flex-end;
         box-shadow: inset 0 0 0 1px rgba(255,255,255,.06); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { background: var(--surface); border-radius: 999px; padding: 10px 14px; font-size: 13px; color: var(--dim); display: flex; gap: 6px; align-items: center; }
  .chip.cur { color: var(--text); box-shadow: inset 0 0 0 1px var(--accent); }
  .toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 18px); transform: translateX(-50%) translateY(20px); opacity: 0;
           background: var(--surface-hi); color: var(--text); padding: 10px 16px; border-radius: 999px; font-size: 13px; transition: .2s; pointer-events: none; }
  .toast.show { opacity: 1; transform: translateX(-50%); }
  .locked { text-align: center; margin-top: 30vh; color: var(--dim); }
</style>
</head>
<body>
<header>
  <div class="brand">Lum<span>e</span>n</div>
  <div class="status"><span id="dot" class="dot"></span><span id="status">a ligar…</span></div>
</header>

<main id="app" hidden>
  <div class="pad">
    <button class="up" data-key="up" aria-label="Cima">⌃</button>
    <button class="left" data-key="left" aria-label="Esquerda">‹</button>
    <button class="ok" data-key="ok">OK</button>
    <button class="right" data-key="right" aria-label="Direita">›</button>
    <button class="down" data-key="down" aria-label="Baixo">⌄</button>
  </div>

  <div class="row">
    <button class="btn" data-key="back"><b>↩</b>Voltar</button>
    <button class="btn accent" data-api="home"><b>⌂</b>Lumen</button>
    <button class="btn" data-key="menu"><b>≡</b>Menu</button>
  </div>
  <div class="row">
    <button class="btn" data-key="rew"><b>«</b>Recuar</button>
    <button class="btn" data-key="play"><b>▶</b>Play</button>
    <button class="btn" data-key="pause"><b>❚❚</b>Pausa</button>
    <button class="btn" data-key="ff"><b>»</b>Avançar</button>
  </div>

  <h2>Volume da TV</h2>
  <div class="volume">
    <button class="btn" data-vol="-1"><b>−</b></button>
    <div class="num"><b id="vol">–</b><span id="muted">volume</span><div class="bar"><i id="volbar"></i></div></div>
    <button class="btn" data-vol="1"><b>+</b></button>
  </div>
  <div class="row"><button class="btn" data-api="mute"><b>🔇</b>Silêncio</button></div>

  <h2>Pesquisar</h2>
  <form class="search" id="search">
    <input id="q" placeholder="Escreva aqui e aparece no Lumen" enterkeyhint="search" autocomplete="off">
    <button>Ir</button>
  </form>

  <h2>Favoritos</h2>
  <div class="grid" id="favs"></div>

  <h2>Entradas da TV</h2>
  <div class="chips" id="sources"></div>

  <h2>Sistema</h2>
  <div class="row">
    <button class="btn" data-api="timer"><b>⏾</b><span id="timer">Temporizador</span></button>
    <button class="btn" data-api="power" data-confirm="Desligar a TV?"><b>⏻</b>Desligar TV</button>
  </div>
</main>
<p class="locked" id="locked" hidden>Abra este comando pelo QR code no Lumen<br>(Sistema → Comando no iPhone).</p>
<div class="toast" id="toast"></div>

<script>
  // O código vem do QR code (?t=...) e fica guardado neste iPhone.
  const params = new URLSearchParams(location.search);
  if (params.get('t')) { localStorage.setItem('lumen-token', params.get('t')); history.replaceState(null, '', '/'); }
  const token = localStorage.getItem('lumen-token');
  const $ = id => document.getElementById(id);
  const esc = t => String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const NAMES = { HDMI1: 'Fire TV', HDMI4: 'PlayStation 5', TV: 'Televisão' };

  if (!token) { $('locked').hidden = false; } else { $('app').hidden = false; }

  async function api(path, params = {}) {
    const qs = new URLSearchParams(params).toString();
    const r = await fetch('/api/' + path + (qs ? '?' + qs : ''), { method: 'POST', headers: { 'X-Lumen-Token': token } });
    if (r.status === 401) { toast('Código inválido — volte a ler o QR code'); throw new Error('401'); }
    return r.json();
  }

  function toast(text) {
    const t = $('toast'); t.textContent = text; t.classList.add('show');
    clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 1600);
  }

  document.addEventListener('click', async e => {
    const b = e.target.closest('button'); if (!b) return;
    try {
      if (b.dataset.key) await api('key', { k: b.dataset.key });
      else if (b.dataset.vol) { await api('volume', { d: b.dataset.vol }); setTimeout(refresh, 400); }
      else if (b.dataset.api) {
        if (b.dataset.confirm && !confirm(b.dataset.confirm)) return;
        await api(b.dataset.api); setTimeout(refresh, 400);
      }
      else if (b.dataset.pkg) { await api('launch', { pkg: b.dataset.pkg }); toast('A abrir ' + b.textContent); }
      else if (b.dataset.src) { await api('source', { id: b.dataset.src }); setTimeout(refresh, 800); }
    } catch (_) {}
  });

  $('search').addEventListener('submit', async e => {
    e.preventDefault(); const q = $('q').value.trim(); if (!q) return;
    await api('search', { q }); $('q').value = ''; $('q').blur(); toast('A pesquisar "' + q + '" no Lumen');
  });

  let favKey = '';
  async function refresh() {
    if (!token || document.hidden) return;
    try {
      const s = await (await fetch('/api/state', { headers: { 'X-Lumen-Token': token } })).json();
      $('dot').classList.toggle('on', !!s.tv);
      $('status').textContent = s.tv ? (NAMES[s.entrada] || s.entrada || 'TV ligada') : 'TV desligada';
      $('vol').textContent = s.silencio ? '🔇' : (s.volume ?? '–');
      $('muted').textContent = s.silencio ? 'sem som' : 'volume';
      $('volbar').style.width = (s.silencio ? 0 : (s.volume || 0)) + '%';
      $('timer').textContent = s.temporizador ? 'desliga ' + new Date(s.temporizador).toTimeString().slice(0, 5) : 'Temporizador';
      const key = JSON.stringify(s.favoritos);
      if (key !== favKey) {
        favKey = key;
        $('favs').innerHTML = s.favoritos.map(a => `<button class="app" style="--c:${esc(a.cor)}" data-pkg="${esc(a.pkg)}">${esc(a.nome)}</button>`).join('');
      }
      $('sources').innerHTML = s.entradas
        .filter(x => x.sinal || NAMES[x.nome] || x.nome === s.entrada)
        .map(x => `<button class="chip ${x.nome === s.entrada ? 'cur' : ''}" data-src="${esc(x.id)}"><span class="dot ${x.sinal ? 'on' : ''}"></span>${esc(NAMES[x.nome] || x.nome)}</button>`).join('');
    } catch (_) { $('status').textContent = 'sem ligação ao Lumen'; $('dot').classList.remove('on'); }
  }
  refresh(); setInterval(refresh, 3000);
  document.addEventListener('visibilitychange', refresh);
</script>
</body>
</html>
